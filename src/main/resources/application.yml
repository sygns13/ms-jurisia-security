server:
  port: 8010

spring:
  application:
    name: ${SPRING_APP_NAME:ms-jurisia-security}

  profiles:
    active: dev

  docker:
    compose:
      enabled: false

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        enable_lazy_load_no_trans: true
    hibernate:
      #ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: >-
      jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:JURISDB_USERS}
      ?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:123456}

  data:
    redis:
      host: localhost
      port: 6379
      prefix: jurisia_security
      ttl: 3600

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}"

api:
  # Keycloak rutas auth
  authorization:
    url: http://localhost:8080
    login:
      path: /realms/jurisia/protocol/openid-connect/token
    introspect:
      path: /realms/jurisia/protocol/openid-connect/token/introspect
    logout:
      path: /realms/jurisia/protocol/openid-connect/logout
  # Consultas al SIJ
  judicial:
    url: http://localhost:8012
    get:
      user:
        path: /v1/usuario/consulta
